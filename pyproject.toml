[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-agent"
version = "1.0.0"
description = "Autonomous Multi-Agent B2B AI Sales Platform (Arabic & English) powered by Google Gemini, OpenAI, Claude, or Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "google-genai>=2.30.1",
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=3.0.0,<6",
    "aiosqlite>=0.19.0,<1",
    "pydantic>=2.5.0,<3",
    "pytz>=2024.1",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
sales-agent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
